volumes:
  db-data:
    driver: local
  grafana-data:
    driver: local
  prometheus-data:
    driver: local

networks:
  app:
    driver: bridge

services:
  app:
    build:
      context: .
    networks:
      - app
    depends_on:
      - postgres
    env_file:
      - .env
    ports:
      - '8081:8081'
  postgres:
    image: 'postgres:17'
    container_name: 'bot-postgres'
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - app


  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - app

  grafana:
    image: grafana/grafana:10.2.4
    ports:
      - "4000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - app
